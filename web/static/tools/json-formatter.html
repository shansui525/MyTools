<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON格式化 - MyTools</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-json-formatter">
  <header>
    <div class="header-inner">
      <a class="back-link" href="/">&larr; 返回工具箱</a>
      <h1>{ } JSON 格式化</h1>
      <p class="subtitle">格式化、压缩、校验 JSON，支持上传文件</p>
      <p class="subtitle-en">JSON Formatter</p>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="toolbar">
        <button class="btn btn-primary btn-sm" id="formatBtn">格式化</button>
        <button class="btn btn-secondary btn-sm" id="minifyBtn">压缩</button>
        <button class="btn btn-secondary btn-sm" id="validateBtn">校验</button>
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
          上传文件
          <input type="file" id="fileInput" accept=".json,.txt" hidden>
        </label>
        <label style="font-size:0.85rem;color:var(--text-muted);margin-left:auto;">
          缩进
          <select id="indentSelect" style="margin-left:0.25rem;padding:0.25rem 0.5rem;border-radius:6px;border:1px solid var(--border);">
            <option value="2" selected>2 空格</option>
            <option value="4">4 空格</option>
          </select>
        </label>
        <label style="font-size:0.85rem;color:var(--text-muted);">
          <input type="checkbox" id="sortKeys"> 键名排序
        </label>
      </div>

      <div class="json-panels">
        <div class="json-panel">
          <div class="panel-header">
            <span>输入</span>
            <button class="btn btn-secondary btn-sm" id="clearInputBtn">清空</button>
          </div>
          <textarea id="inputText" class="json-textarea json-panel-body" placeholder='粘贴 JSON，例如：{"name":"MyTools","tools":[]}'></textarea>
        </div>
        <div class="json-panel">
          <div class="panel-header">
            <span>输出</span>
            <div class="panel-actions">
              <button class="btn btn-secondary btn-sm" id="expandAllBtn" title="全部展开">展开</button>
              <button class="btn btn-secondary btn-sm" id="collapseAllBtn" title="全部折叠">折叠</button>
              <button class="btn btn-secondary btn-sm" id="copyOutputBtn">复制</button>
            </div>
          </div>
          <div class="json-panel-body json-output-body">
            <div id="outputTree" class="json-tree-view">
              <div class="json-tree-empty">处理结果将显示在这里</div>
            </div>
            <textarea id="outputText" class="json-textarea json-output-text hidden" readonly placeholder="压缩结果将显示在这里"></textarea>
          </div>
        </div>
      </div>

      <div class="json-message-slot">
        <div class="message" id="message"></div>
      </div>
    </section>
  </main>

  <footer class="page-footer-compact">
    <p>MyTools &copy; 2026</p>
  </footer>

  <script src="/static/tools/json_formatter.js"></script>
</body>
</html>
