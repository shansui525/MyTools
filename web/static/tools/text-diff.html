<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本对比 - MyTools</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-text-diff">
  <header>
    <div class="header-inner">
      <a class="back-link" href="/">&larr; 返回工具箱</a>
      <h1>📝 文本对比</h1>
      <p class="subtitle">对比两段文本差异，差异行与字符高亮显示</p>
      <p class="subtitle-en">Text Diff</p>
    </div>
  </header>

  <main>
    <section class="card" id="diffCard">
      <div class="toolbar">
        <button class="btn btn-primary btn-sm" id="compareBtn">开始对比</button>
        <button class="btn btn-secondary btn-sm" id="clearBtn">清空</button>
        <button class="btn btn-secondary btn-sm" id="swapBtn">交换 A/B</button>
        <button class="btn btn-secondary btn-sm hidden" id="toggleInputBtn">收起输入</button>
        <button class="btn btn-secondary btn-sm hidden" id="exportHtmlBtn">导出 HTML</button>
        <span class="diff-stats" id="diffStats"></span>
      </div>

      <div class="diff-panels">
        <div class="diff-panel">
          <div class="panel-header">
            <span>文本 A</span>
            <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
              上传
              <input type="file" id="fileA" accept=".txt,.json,.csv,.md,.log" hidden>
            </label>
          </div>
          <textarea id="textA" class="json-textarea diff-input" placeholder="粘贴或输入第一段文本..."></textarea>
        </div>
        <div class="diff-panel">
          <div class="panel-header">
            <span>文本 B</span>
            <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
              上传
              <input type="file" id="fileB" accept=".txt,.json,.csv,.md,.log" hidden>
            </label>
          </div>
          <textarea id="textB" class="json-textarea diff-input" placeholder="粘贴或输入第二段文本..."></textarea>
        </div>
      </div>

      <div class="diff-result-section hidden" id="resultSection">
        <div class="panel-header">
          <span>对比结果</span>
          <div class="diff-legend">
            <span class="legend-item legend-delete">删除</span>
            <span class="legend-item legend-insert">新增</span>
            <span class="legend-item legend-replace">修改</span>
          </div>
        </div>
        <div class="diff-result-panels">
          <div class="diff-result-panel">
            <div class="diff-result-header">A</div>
            <div class="diff-result-body" id="resultA"></div>
          </div>
          <div class="diff-result-panel">
            <div class="diff-result-header">B</div>
            <div class="diff-result-body" id="resultB"></div>
          </div>
        </div>

        <div id="diffSummaryPanel" class="diff-summary-panel hidden">
          <div class="diff-summary-header">
            <span id="diffSummaryText">差异摘要</span>
          </div>
          <ul id="diffSummaryList" class="diff-summary-list"></ul>
        </div>
      </div>

      <div class="json-message-slot">
        <div class="message" id="message"></div>
      </div>
    </section>
  </main>

  <footer class="page-footer-compact">
    <p>MyTools &copy; 2026</p>
  </footer>

  <script src="/static/tools/text_diff.js?v=3"></script>
</body>
</html>
